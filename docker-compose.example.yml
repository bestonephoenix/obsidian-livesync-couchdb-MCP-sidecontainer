# Example: MCP side container paired with the upstream oleduc CouchDB container.
#
# Usage:
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env
#   docker compose up -d
#
# The MCP container is built from this repo's Dockerfile. Once CI publishing is
# enabled, you can replace `build: .` with a pinned published image, e.g.:
#   image: bestonephoenix/obsidian-livesync-mcp:latest

services:
  couchdb:
    image: oleduc/docker-obsidian-livesync-couchdb:latest
    container_name: obsidian-couchdb
    restart: unless-stopped
    ports:
      - "${COUCHDB_PORT:-5984}:5984"
    environment:
      - SERVER_DOMAIN=${SERVER_DOMAIN:-localhost}
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?required}
      - COUCHDB_DATABASE=${COUCHDB_DATABASE:-obsidian}
    volumes:
      - ${COUCHDB_DATA:-./couchdb-data}:/opt/couchdb/data

  mcp:
    build: .
    image: obsidian-livesync-mcp:latest
    container_name: obsidian-mcp
    restart: unless-stopped
    depends_on:
      - couchdb
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      - OBSIDIAN_COUCH_URL=http://couchdb:5984
      - OBSIDIAN_COUCH_USER=${COUCHDB_USER:-admin}
      - OBSIDIAN_COUCH_PASS=${COUCHDB_PASSWORD:?required}
      - OBSIDIAN_COUCH_DB=${COUCHDB_DATABASE:-obsidian}
      - LIVESYNC_PASSPHRASE=${LIVESYNC_PASSPHRASE:-}
