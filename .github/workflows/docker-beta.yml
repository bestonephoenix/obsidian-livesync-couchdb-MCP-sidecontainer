name: Docker Beta (GHCR)

# Beta channel: publishes every feature-branch build to GHCR.
# The release pipeline (docker-publish.yml) is untouched — `latest` on GHCR
# only appears after a real GitHub release. GHCR `beta` cannot collide with it.
#
# Pull:
#   docker pull ghcr.io/bestonephoenix/obsidian-livesync-couchdb-mcp-sidecontainer:beta
# or pin a branch build:
#   docker pull ghcr.io/bestonephoenix/obsidian-livesync-couchdb-mcp-sidecontainer:feat-mcp2

on:
  push:
    branches: ["feat/**"]

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase on purpose: GHCR rejects uppercase image names, and
  # ${{ github.repository }} contains uppercase (repo name has "MCP").
  # Same convention as docker-publish.yml.
  IMAGE_NAME: bestonephoenix/obsidian-livesync-couchdb-mcp-sidecontainer

jobs:
  build-and-push-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN is enough — no Docker Hub secret needed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=beta
            type=ref,event=branch

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
